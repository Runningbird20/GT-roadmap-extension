<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose Font</title>
    <link rel="stylesheet" href="themes.css">
  </head>
  <body class="font-page">
    <main class="theme-shell" aria-labelledby="font-title">
      <header class="theme-header">
        <button class="back-button" id="back-button" type="button" aria-label="Back to popup">Back</button>
        <div>
          <h1 id="font-title">Choose Font</h1>
          <p>Set the typeface for Degree Roadmap.</p>
        </div>
      </header>

      <section class="font-card" aria-labelledby="font-heading">
        <div class="font-card-header">
          <div>
            <h2 id="font-heading">Fonts</h2>
            <p>Choose a preview style for Degree Roadmap.</p>
          </div>
        </div>
        <div class="font-grid" id="font-grid" aria-label="Available font options"></div>
      </section>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="font-options.js"></script>
    <script src="language-options.js"></script>
    <script src="fonts.js"></script>
  </body>
</html>
